[project]
name = "mtg-screen-scanner"
version = "0.1.0"
description = "Scan a region of the Windows screen, identify Magic: The Gathering cards and show TCGplayer prices."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "mss>=9",
    "requests>=2.31",
    "ijson>=3.2",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
mtgscan = "mtgscan.ui:main"
mtgscan-build-index = "mtgscan.index:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mtgscan"]
